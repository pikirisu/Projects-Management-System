name: Reset demo workspace

on:
  schedule:
    # 02:00 IST. GitHub pauses schedules after 60 days without repo activity.
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    name: Re-seed the live demo
    runs-on: ubuntu-latest
    # Does nothing until the repository variable DEMO_SERVER_URL is set.
    if: vars.DEMO_SERVER_URL != ''
    env:
      SERVER_URL: ${{ vars.DEMO_SERVER_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      # A free Render service sleeps when idle; the first request starts it.
      - name: Wake the API
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "$SERVER_URL/api/v1/healthcheck" || true)
            if [ "$code" = "200" ]; then echo "awake after attempt $i"; exit 0; fi
            sleep 5
          done
          echo "the API did not become healthy"
          exit 1

      # Deletes every project the demo accounts administer, then re-creates
      # the two sample projects (scripts/seed-demo.mjs).
      - name: Reset the demo workspace
        run: npm run seed -- --reset
